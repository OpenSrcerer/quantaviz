server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml text/plain;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # No build step means no hashed file names, so make browsers revalidate:
    # a redeploy shows up on the next reload instead of next week.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), display-capture=(self)" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
