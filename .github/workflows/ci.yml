name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    name: Syntax, references, configs
    runs-on: ubuntu-latest
    # Put [skip tests] in the commit message to bypass this job.
    if: "!contains(github.event.head_commit.message, '[skip tests]')"

    steps:
      - uses: actions/checkout@v4

      # No build step and no test suite: the cheapest way to catch a broken
      # scene before it ships is to make every file at least parse.
      - name: JavaScript parses
        run: |
          status=0
          for f in js/*.js js/scenes/*.js; do
            node --check "$f" || { echo "::error file=$f::does not parse"; status=1; }
          done
          exit $status

      # A typo in a <script src> fails silently in the browser (one scene just
      # never shows up), so check every referenced file exists.
      - name: Every file index.html loads exists
        run: |
          # Real src/href attributes only (not data-src), local paths only.
          grep -oE '[[:space:]](src|href)="[^"#:]+"' index.html \
            | sed -E 's/^[[:space:]]*(src|href)="(.*)"$/\2/' > refs.txt
          [ -s refs.txt ] || { echo "::error::found no references in index.html"; exit 1; }
          status=0
          while read -r ref; do
            [ -f "$ref" ] || { echo "::error file=index.html::missing $ref"; status=1; }
          done < refs.txt
          echo "$(wc -l < refs.txt) references checked"
          exit $status

      - name: Launcher script
        run: shellcheck start-quanta.sh

      - name: nginx config
        run: |
          docker run --rm -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine nginx -t

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: checks
    # Runs when checks pass, and also when they were deliberately skipped.
    if: |
      always()
      && (needs.checks.result == 'success' || needs.checks.result == 'skipped')
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # GHCR paths must be lowercase; github.repository preserves owner casing.
      - name: Resolve pushed image
        id: image
        run: |
          name=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=${name}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      # Run the published image the way docker-compose.yml does (read-only root,
      # tmpfs /tmp) and fetch the page, the healthcheck and every script it
      # loads. A missing file or an nginx that can't start on a read-only
      # filesystem is caught here rather than by Watchtower on the host.
      - name: Verify the published image serves the app
        run: |
          docker pull "${{ steps.image.outputs.ref }}"
          docker run -d --name quanta --read-only --tmpfs /tmp -p 8080:8080 "${{ steps.image.outputs.ref }}"
          trap 'docker logs quanta; docker rm -f quanta >/dev/null' EXIT

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz

          curl -fsS http://127.0.0.1:8080/ -o index.served.html
          grep -q "Quanta Lab" index.served.html || { echo "::error::index page is not Quanta"; exit 1; }

          grep -oE '[[:space:]](src|href)="[^"#:]+"' index.served.html \
            | sed -E 's/^[[:space:]]*(src|href)="(.*)"$/\2/' > refs.txt
          status=0
          while read -r ref; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$ref")
            [ "$code" = "200" ] || { echo "::error::$ref returned $code"; status=1; }
          done < refs.txt
          echo "$(wc -l < refs.txt) files served"
          exit $status

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Image verified as pullable and serving every file the page loads."
            echo "Watchtower rolls this out on its next poll; nothing else to do."
          } >> "$GITHUB_STEP_SUMMARY"
